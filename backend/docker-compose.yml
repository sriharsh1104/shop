services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: shop-kafka
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://localhost:9092
      - --mode
      - dev-container
    ports:
      - '9092:19092'
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'health']
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:7
    container_name: shop-mongodb
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./services/user-service
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - EMAIL_SERVICE_URL=http://email-service:3002
      - KAFKA_BROKERS=kafka:9092
      - MONGODB_URI=mongodb://mongodb:27017/shop-users
      - JWT_SECRET=dev-jwt-secret-change-in-production
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      email-service:
        condition: service_started

  email-service:
    build: ./services/email-service
    ports:
      - '3002:3002'
    environment:
      - PORT=3002
      - KAFKA_BROKERS=kafka:9092
      - MONGODB_URI=mongodb://mongodb:27017/shop-emails
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-Shop <onboarding@resend.dev>}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    ports:
      - '3003:3003'
      - '50051:50051'
    environment:
      - PORT=3003
      - GRPC_PORT=50051

  order-service:
    build: ./services/order-service
    ports:
      - '3004:3004'
    environment:
      - PORT=3004
      - PRODUCT_GRPC_URL=product-service:50051
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - MONGODB_URI=mongodb://mongodb:27017/shop-orders
      - USER_SERVICE_URL=http://user-service:3001
      - INTERNAL_SECRET=dev-internal-secret
    depends_on:
      - product-service
      - kafka
      - mongodb
      - user-service

  payment-service:
    build: ./services/payment-service
    ports:
      - '3005:3005'
    environment:
      - PORT=3005
      - MONGODB_URI=mongodb://mongodb:27017/shop-payments
      - ORDER_SERVICE_URL=http://order-service:3004
      - USER_SERVICE_URL=http://user-service:3001
      - INTERNAL_SECRET=dev-internal-secret
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    depends_on:
      - mongodb
      - order-service
      - user-service

volumes:
  mongodb_data:
